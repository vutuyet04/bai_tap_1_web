server {
    listen 80;
    server_name web1.vutuyet.id.vn;

    root /usr/share/nginx/website1;
    index index.html;

    # Website 1
    location / {
        try_files $uri $uri/ =404;
    }

    # Node-RED API
    location /api/ {
        proxy_pass http://nodered:1880;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


server {
    listen 80;
    server_name web2.vutuyet.id.vn;

    root /usr/share/nginx/website2;
    index index.html;

    # Website 2
    location / {
        try_files $uri $uri/ =404;
    }
}
